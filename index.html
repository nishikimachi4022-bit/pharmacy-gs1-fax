
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1">
<title>医薬品GS1スキャナー</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#101d28;
 color:white;
 font-family:system-ui,sans-serif;
}
header{
 padding:15px;
 background:#12527d;
 font-weight:bold;
 font-size:20px;
}
main{padding:10px}
.camera{
 position:relative;
 width:100%;
 aspect-ratio:16/9;
 max-height:72vh;
 background:#000;
 border-radius:13px;
 overflow:hidden;
}
video{
 width:100%;
 height:100%;
 object-fit:cover;
}
.guide{
 position:absolute;
 top:20%;left:5%;
 width:90%;height:60%;
 border:3px solid #55efc4;
 border-radius:12px;
 pointer-events:none;
 box-shadow:0 0 0 999px #0003;
}
button,input{
 font:inherit;
 border-radius:9px;
 padding:14px;
}
button{
 background:#16a17f;
 color:white;
 border:0;
 font-weight:bold;
}
button:disabled{opacity:.5}
.controls{
 display:flex;
 gap:8px;
 margin-top:12px;
}
.controls button{flex:1}
input{
 width:100%;
 margin:8px 0;
 border:1px solid #adbcc6;
}
#status{min-height:45px;white-space:pre-wrap}
.hint{color:#a8c0cc;font-size:13px}
</style>
</head>
<body>
<header>医薬品GS1スキャン</header>
<main>
  <div class="camera">
    <video id="video"
      autoplay playsinline muted></video>
    <div class="guide"></div>
  </div>
  <div class="controls">
    <button id="start">カメラ開始</button>
    <button id="stop">停止</button>
  </div>
  <p id="status">カメラを準備しています…</p>
  <p class="hint">
    GS1を横長の枠に合わせてください。
    読み取り成功後、医薬品確認画面に移動します。
  </p>
  <label for="manual">GTIN手入力（予備）</label>
  <input id="manual"
    inputmode="numeric"
    placeholder="13桁または14桁">
  <button id="manualButton">コードを検索</button>
  <canvas id="canvas" hidden></canvas>
</main>

<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.5/dist/iife/reader/index.js"></script>
<script>
"use strict";

// ↓ GASのWebアプリURLに書き換える
const GAS_URL =
  "https://script.google.com/macros/s/AKfycbyMEBbzk9K3sqllJAZlFyO7ApxI_p7s5lLFWg1as5mmtBAT1Zy-gWTL689cIRUyWATF/exec";

const $=id=>document.getElementById(id);
let stream=null;
let timer=null;
let reading=false;
let busy=false;
let moving=false;

function status(t){
 $('status').textContent=t;
}

function validGTIN(s){
 if(!/^\d{13,14}$/.test(s))return false;
 const a=[...s].map(Number);
 const c=a.pop();
 let sum=0;
 for(let i=a.length-1,j=0;i>=0;i--,j++){
   sum+=a[i]*(j%2===0?3:1);
 }
 return (10-sum%10)%10===c;
}

function extract(raw){
 let s=String(raw||'').trim()
   .replace(/^\][A-Za-z0-9]{2}/,'');

 let m=s.match(/\(01\)(\d{14})/);

 if(!m)m=s.match(/^01(\d{14})/);

 const code=m?m[1]:s;

 if(!validGTIN(code))return null;
 return code.padStart(14,'0');
}

function stop(){
 reading=false;
 if(timer)clearInterval(timer);
 timer=null;
 if(stream){
   stream.getTracks().forEach(t=>t.stop());
   stream=null;
 }
 $('video').srcObject=null;
}

function openProduct(gtin){
 if(moving)return;
 if(!GAS_URL.startsWith('https://script.google.com/')){
   status('先にGAS_URLを設定してください');
   return;
 }
 moving=true;
 stop();
 status('読取成功：'+gtin);
 location.href=GAS_URL+
   (GAS_URL.includes('?')?'&':'?')+
   'gtin='+encodeURIComponent(gtin);
}

async function scanFrame(){
 if(!reading||busy||moving)return;
 const video=$('video');
 if(video.readyState<2)return;

 busy=true;
 try{
   const canvas=$('canvas');
   const w=video.videoWidth;
   const h=video.videoHeight;
   if(!w||!h)return;

   const width=Math.min(w,1600);
   canvas.width=width;
   canvas.height=Math.round(h*width/w);

   const ctx=canvas.getContext('2d',{
     willReadFrequently:true
   });
   ctx.drawImage(video,0,0,canvas.width,canvas.height);

   const results=await ZXingWASM.readBarcodes(
     ctx.getImageData(
       0,0,canvas.width,canvas.height
     ),
     {
       formats:[
         'DataBarLtd','DataBar','DataBarExp',
         'DataMatrix','EAN13','Code128'
       ],
       tryHarder:true,
       tryInvert:true,
       maxNumberOfSymbols:3
     }
   );

   for(const r of results){
     const gtin=extract(r.text);
     if(gtin){
       openProduct(gtin);
       break;
     }
   }
 }catch(e){
   status('読取エラー：'+e.message);
 }finally{
   busy=false;
 }
}

async function start(){
 if(reading||moving)return;

 try{
   if(!window.ZXingWASM?.readBarcodes){
     throw new Error('GS1読取ライブラリを読み込めません');
   }
   stream=await navigator.mediaDevices.getUserMedia({
     video:{
       facingMode:{ideal:'environment'},
       width:{ideal:1920},
       height:{ideal:1080}
     },
     audio:false
   });

   $('video').srcObject=stream;
   await $('video').play();
   reading=true;
   status('GS1を読み取っています…');
   timer=setInterval(scanFrame,600);
 }catch(e){
   stop();
   status('カメラ起動エラー：'+e.message);
 }
}

$('start').onclick=start;
$('stop').onclick=()=>{
 stop();
 status('カメラを停止しました');
};
$('manualButton').onclick=()=>{
 const gtin=extract($('manual').value);
 if(!gtin){
   status('有効なGTINを入力してください');
   return;
 }
 openProduct(gtin);
};
window.addEventListener('pagehide',stop);
start();
</script>
</body>
</html>
