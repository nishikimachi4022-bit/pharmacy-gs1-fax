<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>医薬品GS1発注</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#101d28;
 color:#fff;
 font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;
 -webkit-user-select:none;
 user-select:none;
}
main{max-width:640px;margin:0 auto;padding:8px 10px 20px}
.card{background:#1b2c3a;border-radius:12px;padding:10px 12px;margin-bottom:8px}
.sub{font-size:13px;color:#b9cdd9}
.hidden{display:none!important}

/* 注文リスト */
#listHead{display:flex;justify-content:space-between;align-items:center;font-weight:bold}
#list{max-height:22vh;overflow-y:auto;margin-top:4px;font-size:14px}
.group{color:#8fd3ff;font-size:12px;margin-top:6px}
.item{display:flex;justify-content:space-between;gap:8px;padding:5px 0;border-top:1px solid #2c4152}
.item .name{flex:1;min-width:0}
.item .q{font-weight:bold;white-space:nowrap}
.item.pending{color:#f7d794}
.item.error{color:#ffb3b3}
.item .tag{font-size:12px;margin-left:6px}
.item button{height:28px;font-size:13px;padding:0 10px}

/* カメラ（読み取った商品はカメラの上に重ねて表示） */
.camera{
 position:relative;
 width:100%;
 aspect-ratio:16/9;
 max-height:30vh;
 background:#000;
 border-radius:12px;
 overflow:hidden;
}
video{width:100%;height:100%;object-fit:cover}
#camMsg{
 position:absolute;left:0;right:0;bottom:6px;
 text-align:center;font-size:13px;
 text-shadow:0 0 4px #000,0 0 4px #000;
}
#overlay{
 position:absolute;inset:0;
 padding:10px 12px;
 display:flex;flex-direction:column;justify-content:center;
 background:#14532df2;
}
#overlay.ng{background:#7f1d1df2}
#pName{font-size:19px;font-weight:bold;line-height:1.3;overflow-wrap:anywhere}
#pSub,#pCode{font-size:13px;color:#e3f1e8;overflow-wrap:anywhere}
#pSupplier{font-size:16px;font-weight:bold;margin-top:4px}

/* 数量・テンキー */
.qtyRow{display:flex;justify-content:space-between;align-items:baseline;margin:4px 4px 6px}
#qty{font-size:36px;font-weight:bold}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
button{
 font:inherit;
 border:0;
 border-radius:10px;
 height:48px;
 font-size:24px;
 font-weight:bold;
 background:#e8eef4;
 color:#13222f;
 touch-action:manipulation;
}
button.word{font-size:16px;background:#c9d6e2}
button.cancel{background:#f3c4c4;color:#7f1d1d}
#ok{
 width:100%;
 height:76px;
 margin-top:8px;
 background:#16a17f;
 color:#fff;
 font-size:28px;
}
button:disabled{opacity:.35}
#msg{min-height:20px;margin-top:8px;white-space:pre-wrap}
#msg.error{color:#ffb3b3}

#toast{
 position:fixed;left:50%;top:12px;transform:translateX(-50%);
 max-width:92%;
 background:#16a17f;color:#fff;font-weight:bold;
 padding:12px 16px;border-radius:12px;
 box-shadow:0 4px 16px #0008;
 transition:opacity .3s;
 opacity:0;pointer-events:none;
}
#toast.show{opacity:1}
#toast.warn{background:#b45309}

/* 合言葉 */
#passScreen{
 position:fixed;inset:0;z-index:10;
 background:#101d28;
 display:flex;align-items:center;justify-content:center;
 padding:20px;
}
#passScreen input{
 font:inherit;font-size:18px;
 width:100%;padding:12px;margin:10px 0;
 border-radius:10px;border:1px solid #adbcc6;
}
</style>
</head>
<body>

<div id="passScreen" class="hidden">
  <div class="card" style="width:100%;max-width:420px">
    <div style="font-weight:bold;font-size:18px">合言葉を入力してください</div>
    <div class="sub">この端末に記憶されます。最初の1回だけ必要です。</div>
    <input id="passInput" type="password" autocomplete="off">
    <button id="passSave" style="width:100%;background:#16a17f;color:#fff;font-size:18px">保存</button>
    <div id="passMsg" class="sub" style="margin-top:8px"></div>
  </div>
</div>

<main>
  <section class="card">
    <div id="listHead">
      <span id="listTitle">注文リスト</span>
      <button id="reload" class="word" style="height:34px;padding:0 14px;font-size:14px">更新</button>
    </div>
    <div id="list"></div>
  </section>

  <div class="camera" id="camera">
    <video id="video" autoplay playsinline muted></video>
    <div id="camMsg">カメラを準備しています…</div>
    <div id="overlay" class="hidden">
      <div id="pCode"></div>
      <div id="pName"></div>
      <div id="pSub"></div>
      <div id="pSupplier"></div>
    </div>
  </div>
  <!-- カメラが自動で起動できなかったときだけ表示 -->
  <button id="camStart" class="hidden" style="width:100%;margin-top:6px;font-size:18px">カメラを開始</button>

  <div class="qtyRow">
    <span class="sub">数量</span>
    <span id="qty">-</span>
  </div>
  <div class="keys" id="keys"></div>
  <button id="ok">確定</button>
  <div id="msg" class="sub"></div>
</main>

<div id="toast"></div>
<canvas id="canvas" hidden></canvas>

<script src="https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.5/dist/iife/reader/index.js"></script>
<script>
"use strict";

// GASのウェブアプリURL
const GAS_URL =
  'https://script.google.com/macros/s/AKfycbyMEBbzk9K3sqllJAZlFyO7ApxI_p7s5lLFWg1as5mmtBAT1Zy-gWTL689cIRUyWATF/exec';

const PASS_KEY = 'gs1order.passcode';
const QUEUE_KEY = 'gs1order.queue';
const SCAN_MS = 200;           // 読み取りの間隔
const CONFIRM_MS = 1500;       // この時間内に同じコードを2回読めたら採用
const COOLDOWN_MS = 4000;      // 確定直後に同じコードを無視する時間
const RETRY_MS = 5000;         // 通信失敗時の再送間隔
const MASTER_REFRESH_MS = 30 * 60 * 1000;  // マスタの再読み込み間隔
const MAX_DIGITS = 4;          // 数量は 1〜9999

const $ = id => document.getElementById(id);

let stream = null;
let timer = null;
let frameBusy = false;

// scan：読み取り中 / input：数量入力
let state = 'scan';
let current = null;   // { gtin, product, requestId }
let qty = '';
let qtyTouched = false;
let firstHit = { code: '', time: 0 };
let recent = { code: '', time: 0 };

let master = null;    // Map: GTIN → 商品
let masterDup = new Set();
let serverRows = [];  // GASから取得した未送信の注文
let queue = loadQueue();
let sending = false;
let retryTimer = null;

/* ---------- 共通 ---------- */

function storageGet(key) {
  try { return localStorage.getItem(key) || ''; } catch (e) { return ''; }
}

function storageSet(key, value) {
  try {
    if (value) localStorage.setItem(key, value);
    else localStorage.removeItem(key);
  } catch (e) { /* 保存できない環境では毎回入力 */ }
}

function uuid() {
  if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
  const b = crypto.getRandomValues(new Uint8Array(16));
  b[6] = (b[6] & 0x0f) | 0x40;
  b[8] = (b[8] & 0x3f) | 0x80;
  const h = [...b].map(x => x.toString(16).padStart(2, '0')).join('');
  return h.slice(0, 8) + '-' + h.slice(8, 12) + '-' + h.slice(12, 16) + '-' +
    h.slice(16, 20) + '-' + h.slice(20);
}

function message(text, isError) {
  $('msg').textContent = text || '';
  $('msg').className = 'sub' + (isError ? ' error' : '');
}

let toastTimer = null;
function toast(text, warn) {
  const el = $('toast');
  el.textContent = text;
  el.className = 'show' + (warn ? ' warn' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = warn ? 'warn' : ''; }, warn ? 5000 : 2000);
}

function vibrate(ms) {
  if (navigator.vibrate) navigator.vibrate(ms);
}

/* ---------- GASとの通信 ---------- */

/** retry が true のエラーは、時間をおいて再送してよいもの */
function apiError(text, retry) {
  const e = new Error(text);
  e.retry = retry;
  return e;
}

async function api(action, params) {
  const pass = storageGet(PASS_KEY);
  if (!pass) {
    showPass();
    throw apiError('合言葉が設定されていません。', false);
  }

  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 30000);
  let res;

  try {
    // Content-Type を付けない（text/plain）ことで、GASへ直接送れる
    res = await fetch(GAS_URL, {
      method: 'POST',
      body: JSON.stringify(Object.assign({ action: action, passcode: pass }, params || {})),
      signal: controller.signal
    });
  } catch (e) {
    throw apiError('通信できませんでした。', true);
  } finally {
    clearTimeout(timeout);
  }

  let json;
  try {
    json = await res.json();
  } catch (e) {
    throw apiError('GASの応答を読み取れません。', true);
  }

  if (!json.ok) {
    if (json.error === '合言葉が違います。') {
      storageSet(PASS_KEY, '');
      showPass('合言葉が違います。もう一度入力してください。');
    }
    const busy = /少し待って/.test(json.error || '');
    throw apiError(json.error || 'エラーが発生しました。', busy);
  }

  return json.data;
}

/* ---------- 合言葉 ---------- */

function showPass(text) {
  $('passMsg').textContent = text || '';
  $('passInput').value = '';
  $('passScreen').classList.remove('hidden');
}

$('passSave').onclick = () => {
  const value = $('passInput').value.trim();
  if (value.length < 8) {
    $('passMsg').textContent = '8文字以上で入力してください。';
    return;
  }
  storageSet(PASS_KEY, value);
  $('passScreen').classList.add('hidden');
  startup();
};

/* ---------- 医薬品マスタ（スマホ側で照合するため） ---------- */

async function loadMaster() {
  try {
    const data = await api('master');
    const map = new Map();
    data.items.forEach(r => {
      map.set(r[0], { gtin: r[0], yj: r[1], name: r[2], pack: r[3], maker: r[4], supplier: r[5] });
    });
    master = map;
    masterDup = new Set(data.duplicates || []);
    if (state === 'scan') $('camMsg').textContent = '';
  } catch (e) {
    if (!master) $('camMsg').textContent = 'マスタを読み込めません（読み取り時にGASで照合します）';
  }
}

/** スマホ側で照合する。マスタ未読み込みのときだけGASに問い合わせる */
async function findLocal(gtin) {
  if (!master) {
    const p = await api('lookup', { gtin: gtin });
    return p.found ? { product: p } : { error: p.message || '未登録のコードです' };
  }
  if (masterDup.has(gtin)) {
    return { error: '医薬品マスタに同じGTINが複数あります。マスタを修正してください。' };
  }
  const p = master.get(gtin);
  if (!p) return { error: '未登録のコードです。医薬品マスタにありません。' };
  if (!p.name || !p.pack || !p.supplier) {
    return { error: '医薬品名・包装規格・卸名のいずれかが空欄です。マスタを確認してください。' };
  }
  return { product: p };
}

/* ---------- 送信待ちの登録（画面を閉じても残す） ---------- */

function loadQueue() {
  try { return JSON.parse(storageGet(QUEUE_KEY) || '[]'); } catch (e) { return []; }
}

function saveQueue() {
  storageSet(QUEUE_KEY, queue.length ? JSON.stringify(queue) : '');
}

async function processQueue() {
  if (sending) return;
  const job = queue.find(j => j.status === 'pending');
  if (!job) return;

  if (retryTimer) {
    clearTimeout(retryTimer);
    retryTimer = null;
  }

  sending = true;
  let waitRetry = false;
  try {
    const r = await api('register', {
      gtin: job.gtin,
      quantity: job.quantity,
      requestId: job.requestId
    });

    queue = queue.filter(j => j !== job);
    saveQueue();
    serverRows = serverRows.filter(x => x.id !== r.id).concat([{
      id: r.id, supplier: r.supplier, name: r.name, pack: r.pack, quantity: r.quantity
    }]);

    // 画面に出した内容と、登録時のマスタが違っていたら知らせる
    if (r.name !== job.name || r.pack !== job.pack || r.supplier !== job.supplier) {
      toast('マスタが変更されていました。登録内容：' + r.name + ' ' + r.pack + '（' + r.supplier + '）', true);
    }
  } catch (e) {
    if (e.retry) {
      waitRetry = true;  // 電波が悪いときなど。少し待って再送する
      retryTimer = setTimeout(processQueue, RETRY_MS);
    } else {
      job.status = 'error';
      job.error = e.message;
      saveQueue();
      toast('登録できませんでした：' + job.name, true);
    }
  } finally {
    sending = false;
    renderList();
  }

  if (waitRetry) return;
  if (queue.some(j => j.status === 'pending')) {
    processQueue();
  } else if (!queue.length) {
    loadList();
  }
}

function dismissJob(requestId) {
  queue = queue.filter(j => j.requestId !== requestId);
  saveQueue();
  renderList();
}

/* ---------- 注文リスト ---------- */

async function loadList() {
  try {
    serverRows = await api('list');
  } catch (e) {
    $('listTitle').textContent = '注文リスト（読み込めません）';
    return;
  }
  renderList();
}

function renderList() {
  // 送信中の登録も、リストに一緒に表示する
  const rows = serverRows.map(r => Object.assign({ kind: '' }, r))
    .concat(queue.map(j => ({
      kind: j.status, supplier: j.supplier, name: j.name, pack: j.pack,
      quantity: j.quantity, requestId: j.requestId, error: j.error
    })));

  const waiting = queue.filter(j => j.status === 'pending').length;
  $('listTitle').textContent = '注文リスト（' + rows.length + '件' +
    (waiting ? '・送信中 ' + waiting : '') + '）';

  const list = $('list');
  list.replaceChildren();

  if (!rows.length) {
    const empty = document.createElement('div');
    empty.className = 'sub';
    empty.textContent = 'まだ登録はありません';
    list.appendChild(empty);
    return;
  }

  const suppliers = [];
  rows.forEach(r => { if (!suppliers.includes(r.supplier)) suppliers.push(r.supplier); });

  suppliers.forEach(s => {
    const head = document.createElement('div');
    head.className = 'group';
    head.textContent = s;
    list.appendChild(head);

    rows.filter(r => r.supplier === s).forEach(r => {
      const item = document.createElement('div');
      item.className = 'item' + (r.kind ? ' ' + r.kind : '');

      const name = document.createElement('span');
      name.className = 'name';
      name.textContent = r.name + '　' + r.pack;
      if (r.kind) {
        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = r.kind === 'pending' ? '送信中…' : '登録できませんでした：' + r.error;
        name.appendChild(tag);
      }

      const q = document.createElement('span');
      q.className = 'q';
      q.textContent = '× ' + r.quantity;
      item.append(name, q);

      if (r.kind === 'error') {
        const close = document.createElement('button');
        close.className = 'word';
        close.textContent = '閉じる';
        close.onclick = () => dismissJob(r.requestId);
        item.appendChild(close);
      }
      list.appendChild(item);
    });
  });
}

$('reload').onclick = () => {
  loadList();
  loadMaster();
  processQueue();
};

/* ---------- GS1 → GTIN ---------- */

function validGTIN(s) {
  if (!/^\d{13,14}$/.test(s)) return false;
  const a = [...s].map(Number);
  const c = a.pop();
  let sum = 0;
  for (let i = a.length - 1, j = 0; i >= 0; i--, j++) {
    sum += a[i] * (j % 2 === 0 ? 3 : 1);
  }
  return (10 - sum % 10) % 10 === c;
}

/** GS1全体（有効期限・ロット等を含む場合も）から (01) のGTINだけを取り出す */
function extract(raw) {
  const s = String(raw || '').trim().replace(/^\][A-Za-z0-9]{2}/, '');
  const m = s.match(/\(01\)(\d{14})/) || s.match(/^01(\d{14})/);
  const code = m ? m[1] : s;
  if (!validGTIN(code)) return null;
  return code.padStart(14, '0');
}

/* ---------- カメラ ---------- */

async function startCamera() {
  if (stream) return;
  try {
    if (!window.ZXingWASM || !ZXingWASM.readBarcodes) {
      throw new Error('読み取りの部品を読み込めません。通信状態を確認してください。');
    }
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: { ideal: 'environment' },
        width: { ideal: 1920 },
        height: { ideal: 1080 }
      },
      audio: false
    });
    const video = $('video');
    video.srcObject = stream;
    await video.play();
    $('camStart').classList.add('hidden');
    $('camMsg').textContent = master ? '' : 'マスタを読み込んでいます…';
    timer = setInterval(scanFrame, SCAN_MS);
  } catch (e) {
    stopCamera();
    const denied = e && e.name === 'NotAllowedError';
    $('camMsg').textContent = denied
      ? 'カメラの使用が許可されていません'
      : 'カメラを起動できません：' + e.message;
    $('camStart').classList.remove('hidden');
  }
}

function stopCamera() {
  if (timer) clearInterval(timer);
  timer = null;
  if (stream) {
    stream.getTracks().forEach(t => t.stop());
    stream = null;
  }
  $('video').srcObject = null;
}

/** 画面に映っている範囲（object-fit: cover で切り取られた部分）だけを解析する */
function visibleArea(video) {
  const box = video.getBoundingClientRect();
  const vw = video.videoWidth;
  const vh = video.videoHeight;
  const scale = Math.max(box.width / vw, box.height / vh);
  const w = Math.min(vw, box.width / scale);
  const h = Math.min(vh, box.height / scale);
  return { x: (vw - w) / 2, y: (vh - h) / 2, w: w, h: h };
}

async function scanFrame() {
  if (state !== 'scan' || frameBusy || !stream) return;
  const video = $('video');
  if (video.readyState < 2 || !video.videoWidth) return;

  frameBusy = true;
  try {
    const area = visibleArea(video);
    const canvas = $('canvas');
    const width = Math.round(Math.min(area.w, 1280));
    canvas.width = width;
    canvas.height = Math.round(area.h * width / area.w);
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(video, area.x, area.y, area.w, area.h, 0, 0, canvas.width, canvas.height);

    const results = await ZXingWASM.readBarcodes(
      ctx.getImageData(0, 0, canvas.width, canvas.height),
      {
        formats: ['DataBar', 'DataBarLtd', 'DataBarExp', 'DataBarExpStk', 'DataMatrix', 'EAN13'],
        tryHarder: true,
        tryInvert: true,
        maxNumberOfSymbols: 2
      }
    );

    for (const r of results) {
      const gtin = extract(r.text);
      if (gtin) {
        onCode(gtin);
        break;
      }
    }
  } catch (e) {
    $('camMsg').textContent = '読取エラー：' + e.message;
  } finally {
    frameBusy = false;
  }
}

/** 誤読を防ぐため、同じコードを続けて2回読めたときだけ採用する */
function onCode(gtin) {
  if (state !== 'scan') return;
  const now = Date.now();

  if (gtin === recent.code && now - recent.time < COOLDOWN_MS) return;

  if (gtin !== firstHit.code || now - firstHit.time > CONFIRM_MS) {
    firstHit = { code: gtin, time: now };
    return;
  }

  firstHit = { code: '', time: 0 };
  lookup(gtin);
}

/* ---------- 照合・入力・確定 ---------- */

function showOverlay(kind, code, name, sub, supplier) {
  $('overlay').className = kind === 'ng' ? 'ng' : '';
  $('pCode').textContent = code;
  $('pName').textContent = name;
  $('pSub').textContent = sub;
  $('pSupplier').textContent = supplier;
}

function updateView() {
  $('qty').textContent = state === 'input' && current && current.product ? (qty || '0') : '-';
  const canInput = state === 'input' && current && current.product;
  document.querySelectorAll('#keys button[data-digit], #back').forEach(b => {
    b.disabled = !canInput;
  });
  $('cancel').disabled = state === 'scan';
  $('ok').disabled = !(canInput && qty);
}

async function lookup(gtin) {
  state = 'input';
  vibrate(80);
  const ticket = current = { gtin: gtin, product: null, requestId: uuid() };
  qty = '';
  qtyTouched = false;
  message('');
  showOverlay('', 'GTIN ' + gtin, '照合しています…', '', '');
  updateView();

  let found;
  try {
    found = await findLocal(gtin);
  } catch (e) {
    found = { error: '照合できませんでした：' + e.message };
  }
  if (current !== ticket) return; // 照合中にキャンセルされた

  if (found.error) {
    showOverlay('ng', 'GTIN ' + gtin, found.error, '発注できません。キャンセルして読み直してください。', '');
  } else {
    const p = found.product;
    ticket.product = p;
    qty = '1';  // 数量は1から
    showOverlay('', 'GTIN ' + p.gtin, p.name, p.pack + (p.maker ? '　' + p.maker : ''), '卸：' + p.supplier);
  }
  updateView();
}

function backToScan() {
  current = null;
  qty = '';
  state = 'scan';
  $('overlay').className = 'hidden';
  updateView();
}

function pressDigit(d) {
  if (state !== 'input' || !current || !current.product) return;
  if (!qtyTouched) {         // 最初のキーで初期値の1を置き換える
    qty = '';
    qtyTouched = true;
  }
  if (d === '0' && !qty) return;           // 先頭に0は入れない
  if (qty.length >= MAX_DIGITS) return;
  qty += d;
  updateView();
}

function pressBack() {
  if (state !== 'input' || !current || !current.product) return;
  qtyTouched = true;
  qty = qty.slice(0, -1);
  updateView();
}

function pressCancel() {
  if (state === 'scan') return;
  backToScan();
  message('');
}

/** 確定：登録は裏側で送り、すぐ次の読み取りに戻る */
function pressOk() {
  if (state !== 'input' || !current || !current.product || !qty) return;
  const p = current.product;

  queue.push({
    requestId: current.requestId,
    gtin: p.gtin,
    quantity: Number(qty),
    name: p.name,
    pack: p.pack,
    supplier: p.supplier,
    status: 'pending'
  });
  saveQueue();

  recent = { code: current.gtin, time: Date.now() };
  vibrate(60);
  toast(p.name + ' × ' + qty);
  backToScan();
  renderList();
  processQueue();
}

/* テンキーを作る */
(function buildKeys() {
  const keys = $('keys');
  ['1', '2', '3', '4', '5', '6', '7', '8', '9'].forEach(d => {
    const b = document.createElement('button');
    b.textContent = d;
    b.dataset.digit = d;
    b.onclick = () => pressDigit(d);
    keys.appendChild(b);
  });

  const cancel = document.createElement('button');
  cancel.id = 'cancel';
  cancel.className = 'word cancel';
  cancel.textContent = 'キャンセル';
  cancel.onclick = pressCancel;

  const zero = document.createElement('button');
  zero.textContent = '0';
  zero.dataset.digit = '0';
  zero.onclick = () => pressDigit('0');

  const back = document.createElement('button');
  back.id = 'back';
  back.className = 'word';
  back.textContent = '戻る';
  back.onclick = pressBack;

  keys.append(cancel, zero, back);
})();

$('ok').onclick = pressOk;
$('camStart').onclick = startCamera;

/* 画面を離れたらカメラを止め、戻ったら再開する */
document.addEventListener('visibilitychange', () => {
  if (document.hidden) {
    stopCamera();
  } else {
    startCamera();
    processQueue();
  }
});
window.addEventListener('pagehide', stopCamera);
window.addEventListener('online', processQueue);

/* 起動 */
function startup() {
  loadMaster();
  loadList();
  renderList();
  processQueue();  // 前回送れなかった登録があれば続きから送る
}

updateView();
renderList();
if (!storageGet(PASS_KEY)) {
  showPass();
} else {
  startup();
}
setInterval(loadMaster, MASTER_REFRESH_MS);
startCamera();
</script>
</body>
</html>
